<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت اینترنت ارزان</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://v1.fontapi.ir/css/Vazirmatn');
        * {
            font-family: 'Vazirmatn', sans-serif;
        }
    </style>
</head>
<body class="text-white min-h-screen flex justify-center items-start bg-[#0d131d]">

    <!-- Main Container -->
    <div class="w-full max-w-2xl min-h-screen flex flex-col justify-start p-4 relative">

        <!-- Header -->
        <header class="flex items-center justify-between py-3 border-b border-gray-800/50 mb-6 relative">
            <span class="font-bold text-base text-gray-100">پنل مدیریت اینترنت ارزان</span>
            <div id="header-actions" class="hidden flex items-center gap-2">
                <button onclick="logout()" class="bg-rose-500/10 border border-rose-500/30 hover:bg-rose-500 text-rose-400 hover:text-white text-xs px-3 py-1.5 rounded-lg transition-all flex items-center gap-1">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    <span>خروج</span>
                </button>
            </div>
        </header>

        <!-- ================= LOGIN SCREEN ================= -->
        <div id="login-screen" class="w-full max-w-md mx-auto">
            <section class="bg-[#151d2a] rounded-2xl p-6 border border-gray-800/40 shadow-xl text-center space-y-4">
                <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold text-emerald-400">خوش آمدید</h1>
                <p class="text-xs text-gray-400">جهت مدیریت بسته‌ها وارد حساب کاربری شوید</p>

                <div class="text-right space-y-3 pt-2">
                    <div>
                        <label class="text-xs text-gray-300 mb-1 block">رمز عبور مدیریت</label>
                        <input type="password" id="login-pass" class="w-full bg-[#0d131d] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors" placeholder="رمز عبور را وارد کنید">
                    </div>

                    <button onclick="login()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-sm transition-all shadow-lg shadow-emerald-500/10 flex items-center justify-center gap-2">
                        <span>ورود به پنل</span>
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    </button>
                </div>
            </section>
        </div>

        <!-- ================= DASHBOARD ================= -->
        <div id="dashboard" class="w-full hidden space-y-6">
            
            <!-- Dashboard Controls -->
            <div class="bg-[#151d2a] border border-gray-800/60 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <h2 class="text-sm font-bold text-gray-100">مدیریت محصولات</h2>
                    <p class="text-[11px] text-gray-400">بسته‌های اینترنت همراه اول و ایرانسل</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openPassModal()" class="bg-[#0d131d] hover:bg-gray-800 border border-gray-700 text-gray-300 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 transition-all">
                        <i data-lucide="key-round" class="w-3.5 h-3.5 text-amber-400"></i>
                        <span>تغییر رمز</span>
                    </button>
                    <button onclick="openModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1 transition-all shadow-lg shadow-emerald-500/10">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>افزودن بسته</span>
                    </button>
                </div>
            </div>

            <!-- Operators Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- MCI Section -->
                <div class="bg-[#151d2a] rounded-2xl p-4 border border-cyan-500/20 space-y-3">
                    <div class="flex items-center gap-2 border-b border-gray-800 pb-3">
                        <div class="w-8 h-8 bg-cyan-500/10 rounded-lg flex items-center justify-center text-cyan-400">
                            <i data-lucide="smartphone" class="w-4 h-4"></i>
                        </div>
                        <h3 class="font-bold text-sm text-cyan-400">همراه اول (MCI)</h3>
                    </div>
                    <div id="mci-list" class="space-y-2.5"></div>
                </div>

                <!-- Irancell Section -->
                <div class="bg-[#151d2a] rounded-2xl p-4 border border-yellow-500/20 space-y-3">
                    <div class="flex items-center gap-2 border-b border-gray-800 pb-3">
                        <div class="w-8 h-8 bg-yellow-500/10 rounded-lg flex items-center justify-center text-yellow-500">
                            <i data-lucide="wifi" class="w-4 h-4"></i>
                        </div>
                        <h3 class="font-bold text-sm text-yellow-500">ایرانسل (Irancell)</h3>
                    </div>
                    <div id="irancell-list" class="space-y-2.5"></div>
                </div>

            </div>
        </div>

    </div>

    <!-- ================= ADD / EDIT MODAL ================= -->
    <div id="pkg-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex justify-center items-center p-4 z-50 hidden">
        <div class="bg-[#151d2a] border border-gray-800 rounded-2xl p-5 w-full max-w-sm space-y-4 text-right relative shadow-2xl">
            <button onclick="closeModal()" class="absolute left-4 top-4 text-gray-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h3 id="modal-title" class="text-sm font-bold text-emerald-400 border-b border-gray-800 pb-2">افزودن محصول جدید</h3>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-gray-300 mb-1 block">اپراتور</label>
                    <select id="pkg-operator" class="w-full bg-[#0d131d] border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                        <option value="mci">همراه اول</option>
                        <option value="irancell">ایرانسل</option>
                    </select>
                </div>

                <div>
                    <label class="text-gray-300 mb-1 block">حجم اینترنت</label>
                    <input type="text" id="pkg-volume" placeholder="مثلاً: 10 گیگابایت" class="w-full bg-[#0d131d] border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-gray-300 mb-1 block">قیمت (تومان)</label>
                    <input type="text" id="pkg-price" placeholder="مثلاً: 50,000" class="w-full bg-[#0d131d] border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-gray-300 mb-1 block">مدت اعتبار</label>
                    <input type="text" id="pkg-duration" placeholder="مثلاً: 30 روزه" class="w-full bg-[#0d131d] border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-gray-300 mb-1 block">شماره کارت جهت واریز</label>
                    <input type="text" id="pkg-card" placeholder="شماره کارت 16 رقمی" class="w-full bg-[#0d131d] border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-gray-300 mb-1 block">آیدی فروشنده/پشتیبان</label>
                    <input type="text" id="pkg-seller" placeholder="مثلاً: @Admin" class="w-full bg-[#0d131d] border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <input type="hidden" id="edit-id">

                <div class="pt-2 flex gap-2">
                    <button onclick="savePackage()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 rounded-xl font-bold transition-all">ثبت بسته</button>
                    <button onclick="closeModal()" class="w-1/3 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2.5 rounded-xl font-bold transition-all">انصراف</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= CHANGE PASSWORD MODAL ================= -->
    <div id="pass-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex justify-center items-center p-4 z-50 hidden">
        <div class="bg-[#151d2a] border border-gray-800 rounded-2xl p-5 w-full max-w-sm space-y-4 text-right relative shadow-2xl">
            <button onclick="closePassModal()" class="absolute left-4 top-4 text-gray-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h3 class="text-sm font-bold text-amber-400 border-b border-gray-800 pb-2">تغییر رمز عبور مدیریت</h3>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-gray-300 mb-1 block">رمز عبور جدید</label>
                    <input type="password" id="new-password" placeholder="رمز جدید را وارد کنید" class="w-full bg-[#0d131d] border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>

                <div class="pt-2 flex gap-2">
                    <button onclick="changePassword()" class="w-full bg-amber-500 hover:bg-amber-600 text-white py-2.5 rounded-xl font-bold transition-all">تغییر رمز</button>
                    <button onclick="closePassModal()" class="w-1/3 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2.5 rounded-xl font-bold transition-all">انصراف</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPassword = "";

        // بررسی وضعیت ورود هنگام بارگذاری اولیه صفحه (حل مشکل رفرش و برگشت)
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            checkAutoLogin();
        });

        async function checkAutoLogin() {
            const isLoggedIn = localStorage.getItem('isAdminLoggedIn');
            if (isLoggedIn === 'true') {
                showDashboard();
                loadPackages();
            }
        }

        async function login() {
            const passInput = document.getElementById('login-pass').value;
            try {
                const res = await fetch('/api/auth');
                const data = await res.json();
                currentPassword = data.password;

                if (passInput === currentPassword) {
                    // ذخیره وضعیت ورود در localStorage
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    showDashboard();
                    loadPackages();
                } else {
                    alert('رمز عبور اشتباه است!');
                }
            } catch (err) {
                alert('خطا در برقراری ارتباط با سرور');
            }
        }

        function logout() {
            localStorage.removeItem('isAdminLoggedIn');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('header-actions').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-pass').value = '';
        }

        function showDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('header-actions').classList.remove('hidden');
            document.getElementById('header-actions').classList.add('flex');
        }

        async function loadPackages() {
            try {
                const res = await fetch('/api/packages');
                const data = await res.json();
                
                const mciList = document.getElementById('mci-list');
                const irancellList = document.getElementById('irancell-list');
                mciList.innerHTML = '';
                irancellList.innerHTML = '';

                if (data.mci && Object.keys(data.mci).length > 0) {
                    Object.keys(data.mci).forEach(id => {
                        mciList.innerHTML += createCardHTML('mci', id, data.mci[id]);
                    });
                } else {
                    mciList.innerHTML = '<div class="text-center text-xs text-gray-500 py-4">هیچ بسته‌ای یافت نشد</div>';
                }

                if (data.irancell && Object.keys(data.irancell).length > 0) {
                    Object.keys(data.irancell).forEach(id => {
                        irancellList.innerHTML += createCardHTML('irancell', id, data.irancell[id]);
                    });
                } else {
                    irancellList.innerHTML = '<div class="text-center text-xs text-gray-500 py-4">هیچ بسته‌ای یافت نشد</div>';
                }

                lucide.createIcons();
            } catch (err) {
                console.error("Error loading packages:", err);
            }
        }

        function createCardHTML(operator, id, item) {
            return `
                <div class="bg-[#0d131d] p-3.5 rounded-xl border border-gray-800/80 space-y-2 relative text-xs hover:border-gray-700 transition-all">
                    <div class="flex justify-between items-start border-b border-gray-800/50 pb-2">
                        <div class="font-bold text-white text-sm flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full ${operator === 'mci' ? 'bg-cyan-400' : 'bg-yellow-400'}"></span>
                            <span>${item.volume}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick='editModal("${operator}", "${id}", ${JSON.stringify(item)})' class="p-1 text-gray-400 hover:text-amber-400 transition-colors">
                                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick='deletePackage("${operator}", "${id}")' class="p-1 text-gray-400 hover:text-rose-400 transition-colors">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="space-y-1 text-gray-300 text-[11px]">
                        <div class="flex justify-between">
                            <span class="text-gray-500">قیمت:</span>
                            <span class="font-bold text-emerald-400">${item.price} تومان</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">مدت:</span>
                            <span>${item.duration}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">شماره کارت:</span>
                            <span class="font-mono text-gray-200">${item.cardNumber}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">فروشنده:</span>
                            <span class="text-amber-400">${item.sellerId}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function openModal() {
            document.getElementById('modal-title').innerText = "افزودن محصول جدید";
            document.getElementById('edit-id').value = "";
            document.getElementById('pkg-operator').disabled = false;
            document.getElementById('pkg-modal').classList.remove('hidden');
            document.getElementById('pkg-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('pkg-modal').classList.add('hidden');
            document.getElementById('pkg-modal').classList.remove('flex');
            clearForm();
        }

        function clearForm() {
            document.getElementById('pkg-volume').value = '';
            document.getElementById('pkg-price').value = '';
            document.getElementById('pkg-duration').value = '';
            document.getElementById('pkg-card').value = '';
            document.getElementById('pkg-seller').value = '';
        }

        async function savePackage() {
            const operator = document.getElementById('pkg-operator').value;
            const id = document.getElementById('edit-id').value;
            const body = {
                volume: document.getElementById('pkg-volume').value,
                price: document.getElementById('pkg-price').value,
                duration: document.getElementById('pkg-duration').value,
                cardNumber: document.getElementById('pkg-card').value,
                sellerId: document.getElementById('pkg-seller').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/packages?operator=${operator}&id=${id}` : `/api/packages?operator=${operator}`;

            await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            closeModal();
            loadPackages();
        }

        function editModal(operator, id, item) {
            document.getElementById('modal-title').innerText = "ویرایش محصول";
            document.getElementById('edit-id').value = id;
            document.getElementById('pkg-operator').value = operator;
            document.getElementById('pkg-operator').disabled = true;
            document.getElementById('pkg-volume').value = item.volume;
            document.getElementById('pkg-price').value = item.price;
            document.getElementById('pkg-duration').value = item.duration;
            document.getElementById('pkg-card').value = item.cardNumber;
            document.getElementById('pkg-seller').value = item.sellerId;
            document.getElementById('pkg-modal').classList.remove('hidden');
            document.getElementById('pkg-modal').classList.add('flex');
        }

        async function deletePackage(operator, id) {
            if (confirm('آیا از حذف این آیتم اطمینان دارید؟')) {
                await fetch(`/api/packages?operator=${operator}&id=${id}`, { method: 'DELETE' });
                loadPackages();
            }
        }

        function openPassModal() { 
            document.getElementById('pass-modal').classList.remove('hidden');
            document.getElementById('pass-modal').classList.add('flex');
        }
        
        function closePassModal() { 
            document.getElementById('pass-modal').classList.add('hidden');
            document.getElementById('pass-modal').classList.remove('flex');
        }

        async function changePassword() {
            const newPassword = document.getElementById('new-password').value;
            if (!newPassword) return alert('رمز جدید را وارد کنید');
            
            await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newPassword })
            });

            alert('رمز عبور تغییر یافت.');
            closePassModal();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت اینترنت ارزان</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; }
    
    /* Login Styles */
    #login-screen { max-width: 350px; margin: 80px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    input, select, button { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
    
    /* Dashboard Styles */
    #dashboard { display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .btn-add { width: auto; font-size: 20px; font-weight: bold; background: #28a745; padding: 5px 15px; }
    .btn-change-pass { width: auto; background: #6c757d; }

    /* Sections & Cards */
    .sections-container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
    .section-box { flex: 1; min-width: 300px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card { border: 1px solid #e0e0e0; padding: 12px; margin-top: 10px; border-radius: 6px; background: #fafafa; position: relative; }
    .card-actions { position: absolute; left: 10px; top: 10px; }
    .btn-icon { background: none; border: none; cursor: pointer; font-size: 16px; margin-left: 5px; width: auto; padding: 0; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 320px; }
  </style>
</head>
<body>

  <!-- صفحه ورود -->
  <div id="login-screen">
    <h3>ورود به پنل مدیریت</h3>
    <input type="password" id="login-pass" placeholder="رمز عبور را وارد کنید">
    <button onclick="login()">ورود</button>
  </div>

  <!-- داشبورد اصلی -->
  <div id="dashboard">
    <div class="header">
      <h2>پنل مدیریت بسته‌ها</h2>
      <div>
        <button class="btn-change-pass" onclick="openPassModal()">تغییر رمز</button>
        <button class="btn-add" onclick="openModal()">+</button>
      </div>
    </div>

    <div class="sections-container">
      <!-- همراه اول -->
      <div class="section-box">
        <h3 style="color: #007bff;">همراه اول (MCI)</h3>
        <div id="mci-list"></div>
      </div>
      <!-- ایرانسل -->
      <div class="section-box">
        <h3 style="color: #ffc107;">ایرانسل (Irancell)</h3>
        <div id="irancell-list"></div>
      </div>
    </div>
  </div>

  <!-- پاپ آپ ثبت / ویرایش محصول -->
  <div id="pkg-modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title">افزودن محصول جدید</h3>
      <select id="pkg-operator">
        <option value="mci">همراه اول</option>
        <option value="irancell">ایرانسل</option>
      </select>
      <input type="text" id="pkg-volume" placeholder="حجم اینترنت (مثلاً 10 گیگ)">
      <input type="text" id="pkg-price" placeholder="قیمت (تومان)">
      <input type="text" id="pkg-duration" placeholder="مدت زمان (مثلاً 30 روز)">
      <input type="text" id="pkg-card" placeholder="شماره کارت">
      <input type="text" id="pkg-seller" placeholder="آیدی فروشنده">
      <input type="hidden" id="edit-id">
      <button onclick="savePackage()" style="margin-top:15px;">ثبت</button>
      <button onclick="closeModal()" style="background:#dc3545;">بستن</button>
    </div>
  </div>

  <!-- پاپ آپ تغییر رمز -->
  <div id="pass-modal" class="modal">
    <div class="modal-content">
      <h3>تغییر رمز عبور</h3>
      <input type="password" id="new-password" placeholder="رمز عبور جدید">
      <button onclick="changePassword()" style="margin-top:15px;">تغییر رمز</button>
      <button onclick="closePassModal()" style="background:#dc3545;">بستن</button>
    </div>
  </div>

  <script>
    let currentPassword = "";

    async function login() {
      const passInput = document.getElementById('login-pass').value;
      const res = await fetch('/api/auth');
      const data = await res.json();
      currentPassword = data.password;

      if (passInput === currentPassword) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadPackages();
      } else {
        alert('رمز عبور اشتباه است!');
      }
    }

    async function loadPackages() {
      const res = await fetch('/api/packages');
      const data = await res.json();
      
      const mciList = document.getElementById('mci-list');
      const irancellList = document.getElementById('irancell-list');
      mciList.innerHTML = '';
      irancellList.innerHTML = '';

      if (data.mci) {
        Object.keys(data.mci).forEach(id => {
          mciList.innerHTML += createCardHTML('mci', id, data.mci[id]);
        });
      }
      if (data.irancell) {
        Object.keys(data.irancell).forEach(id => {
          irancellList.innerHTML += createCardHTML('irancell', id, data.irancell[id]);
        });
      }
    }

    function createCardHTML(operator, id, item) {
      return `
        <div class="card">
          <div class="card-actions">
            <button class="btn-icon" onclick='editModal("${operator}", "${id}", ${JSON.stringify(item)})'>✏️</button>
            <button class="btn-icon" onclick='deletePackage("${operator}", "${id}")'>🗑️</button>
          </div>
          <div><b>حجم:</b> ${item.volume}</div>
          <div><b>قیمت:</b> ${item.price} تومان</div>
          <div><b>مدت:</b> ${item.duration}</div>
          <div><b>کارت:</b> ${item.cardNumber}</div>
          <div><b>فروشنده:</b> ${item.sellerId}</div>
        </div>
      `;
    }

    function openModal() {
      document.getElementById('modal-title').innerText = "افزودن محصول جدید";
      document.getElementById('edit-id').value = "";
      document.getElementById('pkg-operator').disabled = false;
      document.getElementById('pkg-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('pkg-modal').style.display = 'none';
      clearForm();
    }

    function clearForm() {
      document.getElementById('pkg-volume').value = '';
      document.getElementById('pkg-price').value = '';
      document.getElementById('pkg-duration').value = '';
      document.getElementById('pkg-card').value = '';
      document.getElementById('pkg-seller').value = '';
    }

    async function savePackage() {
      const operator = document.getElementById('pkg-operator').value;
      const id = document.getElementById('edit-id').value;
      const body = {
        volume: document.getElementById('pkg-volume').value,
        price: document.getElementById('pkg-price').value,
        duration: document.getElementById('pkg-duration').value,
        cardNumber: document.getElementById('pkg-card').value,
        sellerId: document.getElementById('pkg-seller').value
      };

      const method = id ? 'PUT' : 'POST';
      const url = id ? `/api/packages?operator=${operator}&id=${id}` : `/api/packages?operator=${operator}`;

      await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      closeModal();
      loadPackages();
    }

    function editModal(operator, id, item) {
      document.getElementById('modal-title').innerText = "ویرایش محصول";
      document.getElementById('edit-id').value = id;
      document.getElementById('pkg-operator').value = operator;
      document.getElementById('pkg-operator').disabled = true;
      document.getElementById('pkg-volume').value = item.volume;
      document.getElementById('pkg-price').value = item.price;
      document.getElementById('pkg-duration').value = item.duration;
      document.getElementById('pkg-card').value = item.cardNumber;
      document.getElementById('pkg-seller').value = item.sellerId;
      document.getElementById('pkg-modal').style.display = 'flex';
    }

    async function deletePackage(operator, id) {
      if (confirm('آیا از حذف این آیتم اطمینان دارید؟')) {
        await fetch(`/api/packages?operator=${operator}&id=${id}`, { method: 'DELETE' });
        loadPackages();
      }
    }

    function openPassModal() { document.getElementById('pass-modal').style.display = 'flex'; }
    function closePassModal() { document.getElementById('pass-modal').style.display = 'none'; }

    async function changePassword() {
      const newPassword = document.getElementById('new-password').value;
      if (!newPassword) return alert('رمز جدید را وارد کنید');
      
      await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newPassword })
      });

      alert('رمز عبور تغییر یافت.');
      closePassModal();
    }
  </script>
</body>
</html>
